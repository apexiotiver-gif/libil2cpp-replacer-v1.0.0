buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:4.2.2'
    }
}

apply plugin: 'com.android.library'
apply plugin: 'maven-publish'

group = 'com.github.apexiotiver-gif'
version = '1.0.7'

android {
    compileSdkVersion 33

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 33
    }

    sourceSets {
        main {
            manifest.srcFile 'libil2cpp-replacer-v1.0.0/AndroidManifest.xml'
            res.srcDirs = ['libil2cpp-replacer-v1.0.0/res']
            java.srcDirs = ['src/main/java']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
}

publishing {
    publications {
        release(MavenPublication) {
            groupId = 'com.github.apexiotiver-gif'
            artifactId = 'libil2cpp-replacer-v1.0.0'
            version = '1.0.7'

            afterEvaluate {
                artifact("$buildDir/outputs/aar/${project.name}-release.aar")
            }
        }
    }
}
