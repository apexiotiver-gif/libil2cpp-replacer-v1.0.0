buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.4.2'
        classpath 'com.github.dcendents:android-maven-gradle-plugin:2.1'
    }
}

apply plugin: 'com.android.library'
apply plugin: 'com.github.dcendents.android-maven'

group = 'com.github.apexiotiver-gif'
version = '1.0.4'

android {
    namespace 'mts.com.proxy'
    compileSdk 33

    defaultConfig {
        minSdk 21
        targetSdk 33
    }

    sourceSets {
        main {
            manifest.srcFile 'libil2cpp-replacer-v1.0.0/AndroidManifest.xml'
            res.srcDirs = ['libil2cpp-replacer-v1.0.0/res']
            java.srcDirs = ['src/main/java']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
}
