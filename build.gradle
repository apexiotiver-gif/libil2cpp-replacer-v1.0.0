apply plugin: 'com.android.library'
apply plugin: 'maven'

group = 'com.github.apexiotiver-gif'
version = '1.0.0'

android {
    compileSdk 34

    defaultConfig {
        minSdk 21
        targetSdk 34
    }

    sourceSets {
        main {
            manifest.srcFile 'libil2cpp-replacer-v1.0.0/AndroidManifest.xml'
            res.srcDirs = ['libil2cpp-replacer-v1.0.0/res']
        }
    }
}

dependencies {
    compileOnly files('libil2cpp-replacer-v1.0.0/classes.jar')
}
