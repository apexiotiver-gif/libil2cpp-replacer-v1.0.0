apply plugin: 'java'
apply plugin: 'maven'

group = 'com.github.apexiotiver-gif'
version = '2.0.0'

// Use the pre-built classes.jar directly
jar {
    from zipTree('libil2cpp-replacer-v1.0.0/classes.jar')
}

// Also publish the original jar
artifacts {
    archives file('libil2cpp-replacer-v1.0.0/classes.jar')
}
