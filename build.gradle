buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.0'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'maven'

group = 'com.github.apexiotiver-gif'

android {
    namespace 'mts.com.proxy'
    compileSdk 34

    defaultConfig {
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    sourceSets {
        main {
            manifest.srcFile 'libil2cpp-replacer-v1.0.0/AndroidManifest.xml'
            java.srcDirs = ['.']
            res.srcDirs = ['libil2cpp-replacer-v1.0.0/res']
        }
    }
}

dependencies {
    compileOnly files('libil2cpp-replacer-v1.0.0/classes.jar')
}
